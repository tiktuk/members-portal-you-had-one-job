<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Members portal, you had one job</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon-48.png" alt="" width="32" height="32" />
      <div>
        <h1>Members portal, you had one job</h1>
        <p>MotionLab.Berlin members portal</p>
      </div>
    </header>

    <main>
      <section class="pinned">
        <div class="pinned-head">
          <span class="row-title">Pinned resources</span>
          <a id="overview-link" class="overview-link" href="overview.html" target="_blank" rel="noopener">
            Overview →
          </a>
        </div>
        <p id="pins-status" class="pins-status">No pinned resources yet.</p>
      </section>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Calendar as default view</span>
          <span class="row-hint">Bookings links open the calendar instead of the list.</span>
        </span>
        <input type="checkbox" id="calendar-default" class="switch" />
      </label>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Filters in the main menu</span>
          <span class="row-hint">Adds a “Filters” menu with every resource group. Pin resources to keep them at the top.</span>
        </span>
        <input type="checkbox" id="nav-menu" class="switch" />
      </label>

      <label class="row" id="luma-row">
        <span class="row-text">
          <span class="row-title">Luma events</span>
          <span id="luma-hint" class="row-hint">Merge this space’s upcoming Luma events into the overview cards.</span>
        </span>
        <input type="checkbox" id="luma-events" class="switch" />
      </label>

      <label class="row">
        <span class="row-text">
          <span class="row-title">Block location prompt</span>
          <span class="row-hint">Hides the browser location request the portal makes on every page load.</span>
        </span>
        <input type="checkbox" id="geo-block" class="switch" />
      </label>

      <section class="status">
        <div class="status-line">
          <span id="groups-status">No group data yet.</span>
        </div>
        <button type="button" id="refresh" class="refresh">Refresh groups</button>
      </section>

      <p class="note">
        Changes apply on the next page load. Use the portal’s own “View” dropdown to
        switch to the list view when you need it.
      </p>
    </main>

    <script src="lib/config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
