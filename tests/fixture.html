<!doctype html>
<!--
  Manual/integration harness for the content script.

  It mirrors the portal's navigation markup and stubs the extension APIs and the
  Nexudus resources endpoint, so the menu can be exercised without signing in.

  Run:  python3 -m http.server 8765   (from the project root)
  Open: http://localhost:8765/tests/fixture.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Members portal, you had one job fixture</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/src/portal.css" />
    <style>
      body { padding: 0 0 80px; }
      .fixture-dock {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 1500;
        background: #fff; border-top: 1px solid #dee2e6;
      }
      .fixture-dock-inner { display: flex; justify-content: space-around; }
      .fixture-dock-btn {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 8px 4px; border: 0; background: none; color: #495057;
        font-size: 11px;
      }
      .fixture-dock-icon { font-size: 20px; line-height: 24px; }
      .fixture-bar {
        position: fixed; bottom: 68px; left: 0; right: 0; z-index: 2000;
        background: #f8f9fa; border-top: 1px solid #dee2e6;
        font: 12px/1.4 ui-monospace, monospace; padding: 8px 12px; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-xl navbar-light bg-light">
      <div class="container-fluid">
        <a class="me-auto navbar-brand" href="/">MotionLab.Berlin</a>
        <div class="navbar-collapse collapse show">
          <ul class="navbar-nav navbar-nav-scroll me-auto mx-auto">
            <li class="nav-item dropdown">
              <button class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                Bookings
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/motionlabberlin/bookings/labs/list">Labs</a></li>
                <li><a class="dropdown-item" href="/motionlabberlin/bookings/machines/list">Machines</a></li>
                <li><a class="dropdown-item" href="/motionlabberlin/bookings/meeting-rooms/list">Meeting rooms</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <button class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                Store
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/motionlabberlin/store/all">All products</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/motionlabberlin/signup">Memberships</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/motionlabberlin/community/board">Community</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Mirrors the portal's bottom dock, shown below 1200px. -->
    <nav class="fixture-dock d-xl-none" aria-label="Main navigation">
      <div class="fixture-dock-inner">
        <button type="button" class="fixture-dock-btn" aria-label="Dashboard">
          <span class="fixture-dock-icon">▦</span>
          <span class="fixture-dock-label">Dashboard</span>
        </button>
        <button type="button" class="fixture-dock-btn" aria-label="Bookings" aria-haspopup="menu">
          <span class="fixture-dock-icon">▤</span>
          <span class="fixture-dock-label">Bookings</span>
        </button>
        <button type="button" class="fixture-dock-btn" aria-label="Store" aria-haspopup="menu">
          <span class="fixture-dock-icon">▧</span>
          <span class="fixture-dock-label">Store</span>
        </button>
        <button type="button" class="fixture-dock-btn" aria-label="More options" aria-haspopup="menu">
          <span class="fixture-dock-icon">⋯</span>
          <span class="fixture-dock-label">More</span>
        </button>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <label class="form-label">Book from/until</label>
          <div class="text-muted small">fixture page — see the bar below for URL changes</div>
        </div>
        <div class="d-flex gap-3 align-items-center">
          <div class="dropdown">
            <button
              class="btn btn-link text-body dropdown-toggle"
              id="resourceViewDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              View
            </button>
            <ul class="dropdown-menu" aria-labelledby="resourceViewDropdown">
              <li><a class="dropdown-item" href="/motionlabberlin/bookings/machines/list">List</a></li>
              <li><a class="dropdown-item" href="/motionlabberlin/bookings/machines/calendar">Calendar</a></li>
            </ul>
          </div>
          <button class="btn btn-link text-body" type="button">Resources</button>
        </div>
      </div>

      <div class="card p-4 text-muted">Bookings content would render here.</div>
    </main>

    <div class="fixture-bar" id="fixture-bar"></div>

    <script>
      // `?tour=1` forces the first-run pinning tour; without it the tour counts
      // as already seen, so a normal fixture reload stays quiet.
      const fixtureTour = new URLSearchParams(location.search).has("tour");
      // `?onejob-resource=<id>` opens the single-resource view, so the day grid
      // can be checked without walking the menu first.
      const fixtureResource = new URLSearchParams(location.search).get("onejob-resource");

      // Pretend we are on the real portal route.
      history.replaceState(
        {},
        "",
        "/motionlabberlin/bookings/machines/list?start=2026-10-26T21%3A45%3A00.000%2B01%3A00&end=2026-10-26T22%3A45%3A00.000%2B01%3A00" +
          (fixtureResource ? `&onejob-resource=${encodeURIComponent(fixtureResource)}` : ""),
      );

      // A session cookie so the resources fetch is attempted.
      document.cookie =
        "AUTH_TOKEN=" +
        encodeURIComponent(JSON.stringify({ access_token: "fixture-token", expires_at: Date.now() + 3600000 })) +
        "; path=/";

      window.__fixturePayload = {
        Resources: [
          { Id: 1415309474, Name: "Prusa - XL", SystemResourceType: 10, GroupName: "Machines: 3D printing" },
          { Id: 1415309571, Name: "Prusa - MK4", SystemResourceType: 10, GroupName: "Machines: 3D printing" },
          { Id: 1415309496, Name: "OLSK Large CNC", SystemResourceType: 10, GroupName: "Machines: CNC Machining" },
          { Id: 1415309596, Name: "CNC Routermax 1325 Deluxe", SystemResourceType: 10, GroupName: "Machines: CNC Machining" },
          { Id: 1415309492, Name: "xTool F1", SystemResourceType: 10, GroupName: "Machines: Laser Cutting" },
          { Id: 1415309499, Name: "Band Saw Knuth HB 250A", SystemResourceType: 10, GroupName: "Machines: Metalworking" },
          { Id: 1415309593, Name: "Sewing machine Typical GC6-1-D3E", SystemResourceType: 10, GroupName: "Machines: Textile Designing" },
          { Id: 1415309601, Name: "eufyMake E1 UV Printer Workstation", SystemResourceType: 10, GroupName: "Machines: UV printing" },
          { Id: 1415309491, Name: "Table saw / Router table - Hammer B3 winner", SystemResourceType: 10, GroupName: "Machines: Woodworking" },
          { Id: 1415309502, Name: "Outdoor Lab", SystemResourceType: 5, GroupName: "Labs: Outdoor Lab" },
          { Id: 1415309591, Name: "E-Lab", SystemResourceType: 5, GroupName: "Labs: E-Lab" },
          { Id: 1415299774, Name: "Meeting Room: BUS", SystemResourceType: 1, GroupName: "Meeting Rooms" },
        ],
      };

      // Set onboardingVersion to 0 (or delete it) to watch the first-run tour.
      const settings = { calendarDefault: true, navMenu: true, lumaEvents: true, geoBlockPrompt: true, onboardingVersion: fixtureTour ? 0 : 1 };
      const store = {
        "onejob:settings": settings,
        "onejob:pins": [],
        // Lets the pinned overview overlay load without the real portal.
        "onejob:session": {
          accessToken: "fixture-token",
          webAddress: "motionlabberlin",
          expiresAt: Date.now() + 3600000,
          savedAt: Date.now(),
        },
      };
      const listeners = [];
      window.__fixtureStore = store;
      window.chrome = {
        runtime: {
          id: "fixture",
          getURL: (path) => `/src/${path}`,
          // The real extension proxies Luma through background.js (CORS).
          sendMessage: (message, callback) => {
            if (message?.type === "onejob:luma-events") {
              callback({ ok: true, entries: window.__fixtureLumaEvents });
              return;
            }
            if (message?.type === "onejob:luma-description") {
              callback({
                ok: true,
                description:
                  "Kickstart your morning at BreakfastinMotion — coffee, pastries and open networking.",
              });
              return;
            }
            callback({ ok: false, error: "Unknown fixture message." });
          },
        },
        storage: {
          local: {
            get: (keys, callback) => {
              const result = {};
              for (const key of keys) result[key] = store[key];
              callback(result);
            },
            set: (values, callback) => {
              const changes = {};
              for (const [key, value] of Object.entries(values)) {
                changes[key] = { oldValue: store[key], newValue: value };
                store[key] = value;
              }
              for (const listener of listeners) listener(changes, "local");
              if (callback) callback();
            },
          },
          onChanged: {
            addListener: (listener) => listeners.push(listener),
            removeListener: (listener) => {
              const index = listeners.indexOf(listener);
              if (index >= 0) listeners.splice(index, 1);
            },
          },
        },
      };

      // Sample payloads for the pinned overview, relative to today.
      const at = (days, hour) => {
        const date = new Date();
        date.setDate(date.getDate() + days);
        date.setHours(hour, 0, 0, 0);
        return date;
      };
      const iso = (days, hour) => at(days, hour).toISOString();
      const naive = (days, hour) => {
        const date = at(days, hour);
        const pad = (value) => String(value).padStart(2, "0");
        return (
          `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
          `T${pad(date.getHours())}:${pad(date.getMinutes())}:00`
        );
      };

      // `coworkerId`/`coworkerFullName` are what the heatmap matches the
      // member's own rows on; `/api/public/bookings/my` only lists active
      // bookings, so the past one below is marked that way, not by the span.
      window.__fixtureBookings = [
        { id: 9001, resourceId: 1415309496, start: iso(1, 8), end: iso(1, 10), coworkerId: 5001, coworkerFullName: "Alex Kim" },
        { id: 9002, resourceId: 1415309496, start: iso(1, 9), end: iso(1, 11), coworkerId: 5002, coworkerFullName: "Sam Ortiz", tentative: true },
        // In the past, so the statistics screen has something to show while
        // the overview (which only looks forward) ignores it.
        { id: 9003, resourceId: 1415309496, start: iso(-5, 8), end: iso(-5, 10), coworkerId: 5001, coworkerFullName: "Alex Kim" },
        { id: 9004, resourceId: 1415309591, start: iso(2, 14), end: iso(2, 16), coworkerId: 5003, coworkerFullName: "Jo Weber" },
      ];
      window.__fixtureEvents = [
        {
          id: 9101,
          resourceId: 1415309591,
          start: iso(1, 13),
          end: iso(1, 15),
          title: "Laser Cutting 101",
          shortDescription: "Intro workshop for the E-Lab laser.",
          url: "/motionlabberlin/events/laser-cutting-101",
        },
      ];
      window.__fixtureLumaEvents = [
        {
          api_id: "evt-fixture",
          event: {
            api_id: "evt-fixture",
            name: "BreakfastInMotion",
            start_at: iso(2, 9),
            end_at: iso(2, 10),
            url: "fixture-breakfast",
            geo_address_info: { short_address: "Bouchéstraße 12, Berlin" },
          },
        },
      ];
      // Only the active booking: Nexudus's `/api/public/bookings/my` returns
      // "active" bookings, so the past one on the same machine is absent here
      // and the heatmap has to recognise it by the coworker the feed names.
      window.__fixtureMyBookings = {
        Records: [
          {
            Id: 9001,
            ResourceId: 1415309496,
            ResourceName: "OLSK Large CNC",
            FromTime: naive(1, 8),
            ToTime: naive(1, 10),
            CoworkerId: 5001,
            CoworkerFullName: "Alex Kim",
          },
        ],
        HasNextPage: false,
      };

      // A real Response has text() too; the checkout reader uses it.
      const json = (payload) => ({
        ok: true,
        status: 200,
        json: async () => payload,
        text: async () => JSON.stringify(payload),
      });
      const realFetch = window.fetch.bind(window);
      window.fetch = async (url, init) => {
        const target = String(url);
        // Extension resources (overview.css) are served by the dev server;
        // bust its heuristic cache so edits show up without a hard reload.
        if (target.includes("/src/")) {
          return realFetch(`${target}${target.includes("?") ? "&" : "?"}t=${Date.now()}`, init);
        }
        if (target.includes("fullCalendarBookings")) {
          const url = new URL(target);
          const start = new Date(url.searchParams.get("start") || 0);
          const end = new Date(url.searchParams.get("end") || Date.now());
          return json(
            (window.__fixtureBookings || []).filter(
              (booking) => new Date(booking.start) < end && new Date(booking.end) > start,
            ),
          );
        }
        if (target.includes("fullCalendarEvents")) return json(window.__fixtureEvents);
        if (target.includes("/api/public/bookings/my")) return json(window.__fixtureMyBookings);

        // Cancelling one of the member's own bookings: the fee lookup and the
        // DELETE with the reason body the portal's edit page sends.
        const feeMatch = target.match(/\/api\/public\/bookings\/(\d+)\/cancellationFee/);
        if (feeMatch) return json({ hasCancellationFee: false });

        const cancelMatch = target.match(/\/api\/public\/bookings\/(\d+)(?:[?#]|$)/);
        if (cancelMatch && String(init?.method || "GET").toUpperCase() === "DELETE") {
          const id = Number(cancelMatch[1]);
          window.__fixtureBookings = (window.__fixtureBookings || []).filter(
            (item) => Number(item.id) !== id,
          );
          window.__fixtureMyBookings.Records = (window.__fixtureMyBookings.Records || []).filter(
            (item) => Number(item.Id) !== id,
          );
          window.__fixtureCancelled = (window.__fixtureCancelled || []).concat(id);
          window.__fixtureCancelBody = init?.body ? JSON.parse(init.body) : null;
          return json({});
        }

        // The overview's booking dialog: who it books for, the resource's
        // interval, and the portal's own basket preview/invoice pair.
        if (target.includes("/api/public/coworkers/profiles")) {
          return json({ Profiles: [{ Id: 5001, IsDefaultProfile: true, FullName: "Alex Kim" }] });
        }
        const resourceMatch = target.match(/\/api\/public\/resources\/published\/(\d+)(?:[?#]|$)/);
        if (resourceMatch) {
          return json({ Id: Number(resourceMatch[1]), IntervalLimit: 30 });
        }
        if (target.includes("/api/public/checkout/basket/")) {
          let body = {};
          try {
            body = JSON.parse(init?.body || "{}");
          } catch {
            body = {};
          }
          const booking = body.Basket?.[0]?.Booking || {};
          const from = new Date(booking.FromTime);
          const to = new Date(booking.ToTime);
          window.__fixtureBasket = { target, body };

          if (target.includes("/preview")) {
            const clash = (window.__fixtureBookings || []).some(
              (item) =>
                Number(item.resourceId) === Number(booking.ResourceId) &&
                new Date(item.start) < to &&
                new Date(item.end) > from,
            );
            if (clash) {
              return json({ checkout: { Errors: [{ PropertyName: "BOOKING_CONFLICT" }] }, preview: {} });
            }
            if (from < new Date()) {
              return json({ checkout: { Errors: [{ PropertyName: "NO_PAST_BOOKINGS" }] }, preview: {} });
            }
            return json({ checkout: {}, preview: { TotalAmount: 0, Currency: { Code: "EUR" } } });
          }

          const id = 9500 + (window.__fixtureBookings?.length || 0);
          window.__fixtureBookings.push({
            id,
            resourceId: Number(booking.ResourceId),
            start: booking.FromTime,
            end: booking.ToTime,
            coworkerId: Number(booking.CoworkerId),
            coworkerFullName: booking.CoworkerFullName || "Alex Kim",
          });
          // The real invoice endpoint answers with the created record, not the
          // preview's `checkout`/`preview` envelope; keep the mock just as bare.
          return json({ Id: 777 });
        }

        return json(window.__fixturePayload);
      };

      const bar = document.getElementById("fixture-bar");
      const render = () => {
        const pins = (store["onejob:pins"] || []).map((pin) => pin.name || pin.id).join(", ");
        bar.textContent = `path: ${location.pathname}\nsearch: ${location.search}\nallow-list: ${sessionStorage.getItem("onejob:allow-list") ?? "-"}\npins: ${pins || "-"}`;
      };
      render();
      setInterval(render, 200);
    </script>
    <script src="/src/lib/config.js"></script>
    <script src="/src/lib/url.js"></script>
    <script src="/src/lib/groups.js"></script>
    <script src="/src/lib/overview.js"></script>
    <script src="/src/lib/stats.js"></script>
    <script src="/src/lib/overview-view.js"></script>
    <script src="/src/lib/stats-view.js"></script>
    <script src="/src/lib/tour.js"></script>
    <script src="/src/content.js"></script>
  </body>
</html>
